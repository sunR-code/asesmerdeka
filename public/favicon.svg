<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="am_bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="52%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="am_page_left" x1="24" y1="30" x2="60" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="am_page_right" x1="60" y1="30" x2="96" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <linearGradient id="am_gold" x1="72" y1="14" x2="104" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="am_shadow" x="12" y="18" width="96" height="86" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#am_bg)" />
  <rect x="6" y="6" width="108" height="108" rx="26" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2" />

  <!-- Subtle Inner Glow Arc -->
  <path d="M18 30C34 14 86 14 102 30" stroke="#ffffff" stroke-opacity="0.16" stroke-width="3" stroke-linecap="round" />

  <!-- Main Emblem: Open Curriculum Book + Stylized 'A' & Checkmark -->
  <g filter="url(#am_shadow)">
    <!-- Left Wing of Open Book -->
    <path
      d="M60 40C49 33 34 32 23 35C21.3 35.5 20 37 20 38.8V82.5C20 84.6 21.9 86.2 24 85.7C35 83.2 49 84.5 60 92V40Z"
      fill="url(#am_page_left)"
    />
    <!-- Right Wing of Open Book -->
    <path
      d="M60 40C71 33 86 32 97 35C98.7 35.5 100 37 100 38.8V82.5C100 84.6 98.1 86.2 96 85.7C85 83.2 71 84.5 60 92V40Z"
      fill="url(#am_page_right)"
    />

    <!-- Bold 'A' Arch / Graduation Roof Rising from the Book Spine -->
    <path
      d="M60 22L35 72H46.5L52 60H68L73.5 72H85L60 22ZM56 49L60 39.5L64 49H56Z"
      fill="#1e3a8a"
    />
    <path
      d="M60 20L36 70H46.5L52 58H68L73.5 70H84L60 20ZM55.8 47.5L60 37.8L64.2 47.5H55.8Z"
      fill="#ffffff"
    />

    <!-- Emerald Verification Check Ribbon at Book Base -->
    <path
      d="M46 75L56 84L78 62"
      stroke="#0d9488"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Golden AI Sparkle Star (Top Right) -->
  <path
    d="M90 14C90.7 21.8 94.2 25.3 102 26C94.2 26.7 90.7 30.2 90 38C89.3 30.2 85.8 26.7 78 26C85.8 25.3 89.3 21.8 90 14Z"
    fill="url(#am_gold)"
  />
  <circle cx="74" cy="17" r="2.5" fill="#fde047" />
</svg>
